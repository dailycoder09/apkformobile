apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace = "com.familywatch.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.familywatch.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // CI passes -PappVersionCode/-PappVersionName so each release build is uniquely
        // versioned (used by the in-app update check); local builds fall back to 1/"1.0".
        versionCode project.hasProperty('appVersionCode') ? (project.property('appVersionCode') as Integer) : 1
        versionName project.hasProperty('appVersionName') ? project.property('appVersionName') : "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            // Only configured when CI passes these -P properties (a stable keystore decoded
            // from the ANDROID_KEYSTORE_BASE64 secret) — without them, release builds are
            // simply unsigned, same as before this was added, so local dev is unaffected.
            if (project.hasProperty('RELEASE_STORE_FILE')) {
                storeFile file(project.property('RELEASE_STORE_FILE'))
                storePassword project.property('RELEASE_STORE_PASSWORD')
                keyAlias project.property('RELEASE_KEY_ALIAS')
                keyPassword project.property('RELEASE_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (project.hasProperty('RELEASE_STORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.work:work-runtime:2.9.0'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.1.0"
    implementation 'io.livekit:livekit-android:2.7.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha07'
    // Declared as `implementation` (not `api`) inside the @capacitor-firebase/authentication
    // plugin's own build.gradle, so it isn't exposed transitively — redeclare it here so
    // MainActivity/KeepAliveService can call the native FirebaseAuth SDK directly (needed for
    // KeepAliveService, which runs independently of the WebView/JS layer and the plugin's bridge).
    // Version matches the plugin's own default (firebaseAuthVersion in its android/build.gradle).
    implementation 'com.google.firebase:firebase-auth:24.0.1'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
