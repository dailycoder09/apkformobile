name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Get app version
        id: version
        run: echo "version=$(node -p "require('./client/package.json').version")" >> $GITHUB_OUTPUT

      - name: Install server dependencies
        run: npm --prefix server install --production

      - name: Install client dependencies
        run: npm --prefix client install

      - name: Build React app
        run: npm --prefix client run build

      - name: Sync Capacitor Android
        run: cd client && npx cap sync android

      - name: Make Gradle executable
        run: chmod +x client/android/gradlew

      - name: Build debug APK
        run: cd client/android && ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: mv client/android/app/build/outputs/apk/debug/app-debug.apk meeee.apk

      - name: Delete old release if exists
        run: |
          gh release delete latest-build --cleanup-tag --yes || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release with APK
        run: |
          gh release create latest-build meeee.apk \
            --title "meeee v${{ steps.version.outputs.version }}" \
            --notes "Version ${{ steps.version.outputs.version }} — latest build" \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK artifact (backup)
        uses: actions/upload-artifact@v5
        with:
          name: meeee-v${{ steps.version.outputs.version }}
          path: meeee.apk
          retention-days: 30

      - name: Deploy server to GCP VM
        uses: appleboy/ssh-action@v1
        with:
          host: familywatch.duckdns.org
          username: fatemasayed760
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ~/chat-pwa
            git fetch origin ${{ github.ref_name }}
            git checkout ${{ github.ref_name }} 2>/dev/null || git checkout -b ${{ github.ref_name }} origin/${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            npm --prefix server install --production
            npm --prefix client install
            npm --prefix client run build
            sudo systemctl restart familywatch
            echo "✓ Server deployed"
