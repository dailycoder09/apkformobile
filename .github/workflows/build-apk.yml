name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Set app version
        id: version
        # Bumps client/package.json's version so __APP_VERSION__ (baked into the JS bundle
        # at build time) actually changes release to release — otherwise the in-app update
        # check would always compare a version against itself and never detect an update.
        run: |
          VERSION="1.0.${{ github.run_number }}"
          node -e "const fs=require('fs');const p=require('./client/package.json');p.version='$VERSION';fs.writeFileSync('./client/package.json', JSON.stringify(p, null, 2)+'\n')"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Install server dependencies
        run: npm --prefix server ci --production

      - name: Install client dependencies
        run: npm --prefix client ci

      - name: Build React app
        run: npm --prefix client run build

      - name: Sync Capacitor Android
        run: cd client && npx cap sync android

      - name: Make Gradle executable
        run: chmod +x client/android/gradlew

      - name: Decode signing keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > client/android/app/familywatch-release.keystore

      - name: Build release APK
        run: |
          cd client/android && ./gradlew assembleRelease --no-daemon \
            -PRELEASE_STORE_FILE=familywatch-release.keystore \
            -PRELEASE_STORE_PASSWORD="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -PRELEASE_KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -PRELEASE_KEY_PASSWORD="${{ secrets.ANDROID_KEY_PASSWORD }}" \
            -PappVersionCode=${{ github.run_number }} \
            -PappVersionName=${{ steps.version.outputs.version }}

      - name: Rename APK
        run: mv client/android/app/build/outputs/apk/release/app-release.apk meeee.apk

      - name: Delete old release if exists
        run: |
          gh release delete latest-build --cleanup-tag --yes || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release with APK
        run: |
          gh release create latest-build meeee.apk \
            --title "meeee v${{ steps.version.outputs.version }}" \
            --notes "Version ${{ steps.version.outputs.version }} — latest build
          versionCode: ${{ github.run_number }}
          versionName: ${{ steps.version.outputs.version }}" \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK artifact (backup)
        uses: actions/upload-artifact@v5
        with:
          name: meeee-v${{ steps.version.outputs.version }}
          path: meeee.apk
          retention-days: 30

      # Server deploy to the GCP VM is done manually now (see docs/gcp-deployment-runbook.md)
      # rather than from this workflow — the e2-micro VM's 1 vCPU/1GB RAM couldn't reliably
      # finish `npm ci && vite build` within appleboy/ssh-action's 10-minute command_timeout
      # while also running the live app + nginx + a LiveKit Docker container, so CI runs were
      # timing out on this step even when the build itself wasn't broken. Building on this
      # job's much more powerful runner and copying the result over is also just the better
      # pattern generally — if this ever comes back as an automated step, prefer building the
      # client here and `scp`/`rsync`-ing the finished client/dist to the VM over SSH, rather
      # than re-running the whole install+build on the VM itself.

      - name: Install nightly backup timer on GCP VM
        # Sets up the systemd oneshot service + timer that runs
        # server/backup.js nightly to back up the SQLite DB to GCS. Safe to
        # re-run every deploy (copy + daemon-reload + enable --now are all
        # idempotent). continue-on-error so a hiccup here never blocks or
        # fails the core app deploy above, which is the critical path.
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        continue-on-error: true
        with:
          host: familywatch.duckdns.org
          username: fatemasayed760
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ~/chat-pwa
            sudo cp deploy/familywatch-backup.service /etc/systemd/system/familywatch-backup.service
            sudo cp deploy/familywatch-backup.timer /etc/systemd/system/familywatch-backup.timer
            sudo systemctl daemon-reload
            sudo systemctl enable --now familywatch-backup.timer
            echo "✓ Backup timer installed"
