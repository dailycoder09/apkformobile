name: TEMP - Test build only (no deploy)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or ref to build'
        required: true
        default: 'feature/admin-home-calllog-browsing-v2'

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install server dependencies
        run: npm --prefix server ci --production

      - name: Install client dependencies
        run: npm --prefix client ci

      - name: Build React app
        run: npm --prefix client run build

      - name: Sync Capacitor Android
        run: cd client && npx cap sync android

      - name: Make Gradle executable
        run: chmod +x client/android/gradlew

      - name: Decode signing keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > client/android/app/familywatch-release.keystore

      - name: Build release APK
        run: |
          cd client/android && ./gradlew assembleRelease --no-daemon \
            -PRELEASE_STORE_FILE=familywatch-release.keystore \
            -PRELEASE_STORE_PASSWORD="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -PRELEASE_KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -PRELEASE_KEY_PASSWORD="${{ secrets.ANDROID_KEY_PASSWORD }}" \
            -PappVersionCode=999999 \
            -PappVersionName=test-build

      - name: Rename APK
        run: mv client/android/app/build/outputs/apk/release/app-release.apk meeee-test.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: meeee-test-build
          path: meeee-test.apk
          retention-days: 7
